# Este workflow é responsável por executar os testes unitários da aplicação a cada push na branch main.
# A estrutura foi desenhada de forma simples, mas preparada para a futura adição de novos processos de CI.

name: Continuous Deployment

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_SCOPE: lucascarvalhocorreias-projects

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Baixa o código do repositório para o runner do GitHub Actions
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Configura a versão do ambiente Node.js baseada na variável de ambiente global
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para utilizar o Yarn sem necessidade de instalação global extra
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências do projeto contidas no yarn.lock
      - name: Install Dependencies
        run: yarn install

      # Executa a suíte de testes unitários
      - name: Run Unit Tests
        run: yarn test

  
  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: unit-tests
    runs-on: ubuntu-latest
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}
    
    steps:
      # Baixa o código do repositório para o runner do GitHub Actions
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      # Configura a versão do ambiente Node.js baseada na variável de ambiente global
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para utilizar o Yarn sem necessidade de instalação global extra
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependencias do projeto
      - name: Install Dependencies
        run: yarn install

      # Obter as configurações do vercel
      - name: Pul Vercel Config
        run: |
          yarn vercel pull --yes \
          --environment=preview \
          --scope=$VERCEL_SCOPE \
          --token=$VERCEL_TOKEN

      # Build para o vercel
      - name: Build Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      # Deploy preview do vercel
      - name: Deploy preview
        id: deploy
        run: |  
          URL=$(yarn --silent vercel deploy \
          --prebuilt \
          --target=preview \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE)
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT

  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    needs: build-and-deploy
    
    steps:
      # Baixa o código do repositório para o runner do GitHub Actions
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      # Configura a versão do ambiente Node.js baseada na variável de ambiente global
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para utilizar o Yarn sem necessidade de instalação global extra
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências do projeto
      - name: Install Dependencies
        run: yarn install

      # Instalação do chromium para o playwright
      - name: Install Playwright Browsers
        run: yarn playwright install --with-deps chromium

      # Executa a suíte de testes e2e
      - name: Run E2E Regression Tests
        run: yarn playwright test
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment_url }}

      # Relatorio de Testes Automatizados
      - name: Upload Playwright Test Report
        if: ${{!cancelled()}}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report

  promote:
    name: Promote to Production
    needs: [build-and-deploy, e2e-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Vercel promote
        run: |
          yarn verce@latest promote ${{ needs.build-and-deploy.outputs.deployment_url }} \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE \
          --yes